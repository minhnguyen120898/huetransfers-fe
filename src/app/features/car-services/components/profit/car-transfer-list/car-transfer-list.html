<app-table-card title="Transfer Details">
  <app-data-table
    table
    [dataSource]="dataSource"
    [columns]="columns"
    [paginated]="true"
    emptyStateIcon="swap_horiz"
    emptyStateTitle="No transfers"
    emptyStateMessage="No transfer bookings found for this month."
    [tableMaxHeightClass]="'max-h-[32rem]'"
  />
</app-table-card>

<ng-template #netCostTemplate let-row="$implicit">
  <span [class]="row.netCost > 0 ? 'text-red-600 font-semibold whitespace-nowrap' : 'text-green-600 font-semibold whitespace-nowrap'">
    {{ row.netCost | vndCurrency }}
  </span>
</ng-template>
