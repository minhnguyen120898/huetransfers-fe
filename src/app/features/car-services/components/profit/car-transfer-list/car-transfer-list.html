<app-table-card title="Transfer Details">
  <app-data-table
    table
    [dataSource]="dataSource"
    [columns]="columns"
    [paginated]="true"
    emptyStateIcon="swap_horiz"
    emptyStateTitle="No transfers"
    emptyStateMessage="No transfer bookings found for this month."
    [tableMaxHeightClass]="'max-h-[32rem]'"
  />
</app-table-card>

<ng-template #netCostTemplate let-row="$implicit" let-value="value">
  <span [class]="row.netCost > 0 ? 'text-red-600 font-semibold' : 'text-green-600 font-semibold'">
    {{ value }}
  </span>
</ng-template>
