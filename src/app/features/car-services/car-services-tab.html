<mat-card class="card-sm">
  <mat-card-content>
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab>
        <ng-template mat-tab-label>
          <span>Car Bookings</span>
        </ng-template>
        <ng-template matTabContent>
          <app-car-booking-list class="block mt-4" />
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <span>Expenses</span>
        </ng-template>
        <ng-template matTabContent>
          <app-expense-list class="block mt-4" />
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <span>Car Booking Debt</span>
        </ng-template>
        <ng-template matTabContent>
          <app-car-booking-debt-list class="block mt-4" />
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <span>Total</span>
        </ng-template>
        <ng-template matTabContent>
          <div class="flex flex-col mt-4 space-y-6">
            <app-car-profit-summary />
            <app-car-transfer-list />
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
