<mat-form-field class="w-full lg:w-64 form-field-sm" subscriptSizing="dynamic" appearance="outline">
  <mat-label>Select Tour</mat-label>
  <mat-select
    [value]="selectedTour()"
    (selectionChange)="onTourChange($event.value)"
    [compareWith]="compareTours"
    [disabled]="loading()"
    placeholder="Select a tour..."
  >
    @for (tour of publicTours(); track tour.id) {
      <mat-option [value]="tour"> {{ tour.name }} ({{ tour.duration }}) </mat-option>
    } @empty {
      <mat-option disabled>No public tours available</mat-option>
    }
  </mat-select>
  <mat-icon matPrefix>tour</mat-icon>
</mat-form-field>
