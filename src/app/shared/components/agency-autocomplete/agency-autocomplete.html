<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="text"
    [placeholder]="placeholder()"
    [formControl]="searchControl"
    [matAutocomplete]="auto"
    [required]="required()"
    (blur)="onBlur()"
  />
  <mat-icon matPrefix>business</mat-icon>
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayAgency"
    (optionSelected)="onAgencySelected($event.option.value)"
  >
    @for (agency of filteredAgencies(); track agency.id) {
      <mat-option [value]="agency">
        <div class="flex flex-col">
          <span class="font-medium">{{ agency.name }}</span>
          @if (agency.tel || agency.address) {
            <span class="text-xs text-gray-500">
              @if (agency.tel) {
                {{ agency.tel }}
              }
              @if (agency.address) {
                - {{ agency.address }}
              }
            </span>
          }
        </div>
      </mat-option>
    } @empty {
      <mat-option disabled>No agencies found</mat-option>
    }
  </mat-autocomplete>
  @if (hasError) {
    <mat-error>Travel agency is required</mat-error>
  }
</mat-form-field>
