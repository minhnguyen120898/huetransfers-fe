<div class="bg-white flex items-center justify-between gap-4 px-4 py-2">
  <!-- Logo Section -->
  <div class="flex items-center gap-3">
    <div class="hidden lg:flex lg:items-center">
      <div class="flex items-center gap-3">
        <!-- Logo Icon -->
        <div
          class="size-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-md"
        >
          <svg class="size-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>

        <!-- Logo Text -->
        <div class="flex flex-col">
          <h1 class="text-lg font-bold text-gray-900 leading-tight">HOIAN Landscape</h1>
          <p class="text-xs text-gray-500 font-medium">Tour Management</p>
        </div>
      </div>
    </div>
  </div>

  <div class="flex gap-3">
    @if (!isMobile()) {
      <app-sidebar [isMobile]="false"></app-sidebar>
    }
    <button
      type="button"
      [matMenuTriggerFor]="profileMenu"
      class="flex px-2 py-1 items-center gap-2 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer border-none bg-transparent outline-none"
    >
      <!-- Avatar -->
      <div
        class="size-8 flex-shrink-0 rounded-full bg-secondary flex items-center justify-center text-white font-semibold text-sm"
      >
        {{ getUserInitials() }}
      </div>

      <!-- User Info (RIGHT side) -->
      <div class="flex flex-col items-start min-w-0">
        <span class="text-sm font-semibold text-gray-900 leading-tight whitespace-nowrap">
          {{ userName() }}
        </span>
        <span class="text-xs text-gray-500 leading-tight whitespace-nowrap">
          {{ userEmail() }}
        </span>
      </div>
    </button>
  </div>

  <!-- Profile Menu -->
  <mat-menu #profileMenu="matMenu" xPosition="before">
    <div class="p-2 border-b">
      <div class="flex items-center px-2">
        <div class="flex flex-col">
          <span class="text-sm font-medium text-gray-900">{{ userName() }}</span>
          <span class="text-xs text-gray-500">{{ userEmail() }}</span>
        </div>
      </div>
    </div>

    <button
      mat-menu-item
      class="menu-item-sm"
      (click)="handleProfileAction(profileActionEnum.SETTINGS)"
    >
      <mat-icon>settings</mat-icon>
      <span>Setting</span>
    </button>

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      class="menu-item-error menu-item-sm"
      (click)="handleProfileAction(profileActionEnum.SIGN_OUT)"
    >
      <mat-icon>logout</mat-icon>
      <span class="text-error">Logout</span>
    </button>
  </mat-menu>
</div>
